<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Support - Vairy</title>
    <meta name="description" content="Contact Vairy support for help with the app, account issues, or feedback.">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="./assets/images/favicon.png">
    <style>
        .support-container {
            padding: 120px 20px 60px;
            max-width: 600px;
            margin: 0 auto;
            min-height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .support-content {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .support-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .support-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .support-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-main);
            text-decoration: none;
            margin-bottom: 30px;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-link i {
            margin-right: 8px;
        }

        .back-link:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }

        .support-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .form-control {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .btn-submit {
            margin-top: 10px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .contact-alt {
            margin-top: 25px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .contact-alt a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .contact-alt a:hover {
            text-decoration: underline;
        }

        /* Success State Overlay */
        .success-overlay {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .success-overlay i {
            font-size: 4rem;
            color: #4cd964;
            margin-bottom: 20px;
        }

        .success-overlay h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .success-overlay p {
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .support-container {
                padding: 100px 15px 40px;
            }
            .support-content {
                padding: 30px 20px;
            }
            .support-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="container nav-container">
            <a href="./index.html" class="logo">VAIRY</a>
            <div class="nav-actions">
                <button class="theme-toggle" id="theme-toggle" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="support-container">
        <a href="./index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>

        <div class="support-content" id="support-content">
            <div class="support-header">
                <h1>Support</h1>
                <p>How can we help you today?</p>
            </div>

            <form class="support-form" id="support-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" class="form-control" placeholder="What is this about?" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" class="form-control" placeholder="Tell us more..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-submit" id="submit-btn">
                    <span>Send Message</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
                <p class="contact-alt">or you can contact us at <a href="mailto:help@vairyapp.com">help@vairyapp.com</a></p>
            </form>

            <div class="success-overlay" id="success-overlay">
                <i class="fas fa-check-circle"></i>
                <h2>Message Sent!</h2>
                <p>We'll get back to you as soon as possible.</p>
                <p>Redirecting you back home...</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Vairy. All rights reserved.</p>
            <div class="footer-links">
                <a href="./terms.html">Terms</a>
                <a href="./privacy.html">Privacy</a>
                <a href="./support.html">Support</a>
            </div>
        </div>
    </footer>

    <script src="./script.js"></script>
</body>

</html>
